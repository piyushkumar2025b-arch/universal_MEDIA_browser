provider:
  id: thecocktaildb
  name: TheCocktailDB Open Mixology Database
  category:
    - food
    - beverage

documentation:
  website: "https://www.thecocktaildb.com"
  api_docs: "https://www.thecocktaildb.com/api.php"

connection:
  base_url: "https://www.thecocktaildb.com/api/json/v1/1"
  protocol: https
  authentication:
    type: none

endpoints:
  search:
    method: GET
    path: /search.php
    parameters:
      s:
        required: true
        type: string

pagination:
  type: none

response:
  format: json

rate_limit:
  requests_per_second: 10

errors:
  retry:
    - 429
    - 500

validation:
  require:
    - drinks
