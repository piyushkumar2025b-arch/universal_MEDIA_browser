provider:
  id: giphy
  name: GIPHY
  category:
    - gifs

documentation:
  website: "https://giphy.com"
  api_docs: "https://developers.giphy.com/docs/api/"

connection:
  base_url: "https://api.giphy.com/v1"
  protocol: https
  authentication:
    type: api_key
    location: query
    variable: GIPHY_API_KEY

endpoints:
  search:
    method: GET
    path: /gifs/search
    parameters:
      api_key:
        required: true
        type: string
      q:
        required: true
        type: string
      limit:
        required: false
        type: integer
        default: 20
      offset:
        required: false
        type: integer
        default: 0
      rating:
        required: false
        type: string
      lang:
        required: false
        type: string

  get:
    method: GET
    path: /gifs/{gif_id}

  trending:
    method: GET
    path: /gifs/trending

pagination:
  type: offset

response:
  format: json

rate_limit:
  requests_per_hour: 100
  requests_per_month: 10000

errors:
  retry:
    - 429
    - 500
    - 502
    - 503
    - 504

validation:
  require:
    - id
    - title
    - source_url

fallback:
  - wikimedia
