provider:
  id: archive_feature_films
  name: Internet Archive Public Domain Feature Films
  category:
    - video
    - movies

documentation:
  website: "https://archive.org/details/feature_films"
  api_docs: "https://archive.org/help/aboutsearch.htm"

connection:
  base_url: "https://archive.org"
  protocol: https
  authentication:
    type: none

endpoints:
  search:
    method: GET
    path: /advancedsearch.php
    parameters:
      q:
        required: true
        type: string
      rows:
        required: false
        type: integer
        default: 12
      output:
        required: false
        type: string
        default: json

pagination:
  type: page

response:
  format: json

rate_limit:
  requests_per_second: 5

errors:
  retry:
    - 429
    - 500

validation:
  require:
    - response
