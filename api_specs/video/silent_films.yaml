provider:
  id: archive_silent_films
  name: Silent Films Cinema Heritage
  category:
    - videos

documentation:
  website: "https://archive.org/details/silent_films"
  api_docs: "https://archive.org/advancedsearch.php"

connection:
  base_url: "https://archive.org"
  protocol: https
  authentication:
    type: none
    location: none
    variable: null

endpoints:
  search:
    method: GET
    path: /advancedsearch.php
    parameters:
      q:
        required: true
        type: string
      rows:
        required: false
        type: integer
        default: 16
      output:
        required: false
        type: string
        default: json

pagination:
  type: offset

response:
  format: json

rate_limit:
  requests_per_hour: 3600
