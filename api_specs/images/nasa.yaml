provider:
  id: nasa
  name: NASA Image & Video Library
  category:
    - images
    - video
    - space

documentation:
  website: "https://images.nasa.gov"
  api_docs: "https://images.nasa.gov/docs/images.nasa.gov_api_docs.pdf"

connection:
  base_url: "https://images-api.nasa.gov"
  protocol: https
  authentication:
    type: none
    location: none
    variable: null

endpoints:
  search:
    method: GET
    path: /search
    parameters:
      q:
        required: true
        type: string
      media_type:
        required: false
        type: string
        default: image

pagination:
  type: page

response:
  format: json

rate_limit:
  requests_per_hour: 1000
  requests_per_month: 30000

errors:
  retry:
    - 500
    - 503

validation:
  require:
    - collection
    - items

fallback:
  - openverse
  - wikimedia
